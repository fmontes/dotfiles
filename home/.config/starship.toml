# One column of breathing room: herdr has no pane padding, so the prompt puts
# it in itself rather than sitting against the sidebar divider. Both lines need
# it — the format indents the info line, [character] indents the ❯ below it.
format = " $all"

# No blank line before each prompt — starship adds one by default.
add_newline = false

[gcloud]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[java]
disabled = true

[rust]
disabled = true

[dotnet]
disabled = true

[package]
disabled = true

[cmd_duration]
min_time = 5_000
format = "took [$duration]($style) "

[character]
format = " $symbol "
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
