# AeroSpace — deterministic desktop layout
#
# One horizontal track, one app per slot, every app always in the same place.
#
#   1 Desktop  2 Calendar  3 Slack  4 Orca  5 Chrome Work  6 Chrome Me
#   7 VS Code
#   0 Overflow — anything not in the layout, Warp included
#
# Slot 1 is deliberately empty: a clean desktop to land on.
#
# Navigation is spatial (see [mode.main.binding] at the bottom):
#   ctrl-a / ctrl-d  prev / next occupied slot, looping around the ends
#
# Empty slots are skipped, so an app that is not running never presents a blank
# screen you cannot tell apart from the desktop. Slot 1 is exempt. The trade-off
# is that the number of presses between two apps changes as apps open and close
# — the slots themselves never move, and alt-N always jumps straight to one.
#
# Slots are fixed workspace numbers, so closing an app never shifts anything:
# its workspace stays alive and empty (persistent-workspaces), and reopening
# the app lands it back in the same slot (on-window-detected).

config-version = 2

start-at-login = true
auto-reload-config = true

# Land on the empty desktop after login/restart so startup is reproducible.
after-startup-command = ['workspace 1']

# ─── Not a tiling workflow ───────────────────────────────────────────────────
# One app per workspace means tiling never has anything to tile. When a second
# window does land in a slot (a Chrome popup, VS Code opening a new window),
# accordion with zero padding stacks it full-screen instead of splitting.
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'
accordion-padding = 0

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.right = 0
gaps.outer.top = 0
gaps.outer.bottom = 0

# ─── Fixed slots ─────────────────────────────────────────────────────────────
# Keeps every slot alive even when empty. This is what makes closing an app a
# no-op for everything else: slot 2 stays slot 2 whether Calendar is running or
# not, so nothing renumbers or slides over. It also keeps slot 1 empty but
# reachable.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '0']

focus-follows-mouse.enabled = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# ─── Window routing ──────────────────────────────────────────────────────────
# Matched by bundle ID. First match wins (check-further-callbacks defaults to
# false). Nothing routes to slot 1 — that is the point of it.

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.iCal'
run = ['move-node-to-workspace 2']

# A Slack huddle opens a second window that macOS reports as a utility panel,
# so AeroSpace floats it by default. Force it back into tiling and switch the
# slot to horizontal tiles, putting the huddle beside the channel instead of
# on top of it. Must precede the general Slack rule — first match wins.
#
# The slot stays h_tiles after the huddle ends. That is harmless with a single
# window, which fills the screen either way; alt-/ switches it back.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap && test %{window-title} ~= "^Huddle:"'
run = ['move-node-to-workspace 3', 'layout tiling', 'layout h_tiles']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.stablyai.orca'
run = ['move-node-to-workspace 4']

# Chrome splits by profile. Chrome appends the profile name to the window
# title once more than one profile is running, which is the only stable way to
# tell two windows of the same app apart — window-id is reassigned at runtime
# and both profiles share one pid.
#
# Anchor the patterns: bare 'Freddy' is a prefix of 'Freddy (dotcms.com)' and
# would match both. Renaming a Chrome profile silently breaks these rules.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome && test %{window-title} ~= "Freddy \(dotcms\.com\)$"'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome && test %{window-title} ~= "Chrome - Freddy$"'
run = ['move-node-to-workspace 6']

# Fallback: with only one profile running Chrome drops the suffix entirely, so
# an unlabelled Chrome window lands on Work rather than falling to overflow.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.VSCode'
run = ['move-node-to-workspace 7']

# Utilities float on whatever slot is in front instead of stealing one.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.1password.1password'
run = ['layout floating']

# Everything else goes to the overflow slot and takes focus with it, so a
# stray app is never silently swallowed and never lands in a track slot.
[[on-window-detected]]
if = 'true'
run = ['move-node-to-workspace --focus-follows-window 0']

# ─── Monitors ────────────────────────────────────────────────────────────────
# Every slot is pinned to the main display, so the layout is identical on the
# MacBook screen and on an external monitor. When both are connected everything
# follows whichever display macOS calls main (System Settings → Displays).
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
0 = 'main'

# ─── Exec environment ────────────────────────────────────────────────────────
# AeroSpace launches from macOS login with a bare environment, so spell out
# where aerospace-track and the aerospace binary live.
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '${HOME}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# ─── Keys ────────────────────────────────────────────────────────────────────
[mode.main.binding]

# Spatial navigation: prev / next occupied slot, looping around the ends.
# Empty slots are skipped so you never land on a blank screen you cannot
# identify; slot 1 is exempt, being the intentional desktop.
#
# These two are global grabs, so they shadow the terminal's readline keys:
# ctrl-a (beginning of line) and ctrl-d (EOF). Prefix both with 'alt-' to hand
# them back to the shell.
ctrl-a = 'exec-and-forget "$HOME/.local/bin/aerospace-track" left'
ctrl-d = 'exec-and-forget "$HOME/.local/bin/aerospace-track" right'

# Jump straight to a slot. --auto-back-and-forth makes each key a toggle:
# pressing the key for the slot you are already on returns you to the previous
# one, so alt-3 bounces in and out of Slack without a second binding.
alt-1 = 'workspace --auto-back-and-forth 1'
alt-2 = 'workspace --auto-back-and-forth 2'
alt-3 = 'workspace --auto-back-and-forth 3'
alt-4 = 'workspace --auto-back-and-forth 4'
alt-5 = 'workspace --auto-back-and-forth 5'
alt-6 = 'workspace --auto-back-and-forth 6'
alt-7 = 'workspace --auto-back-and-forth 7'
alt-0 = 'workspace --auto-back-and-forth 0'

# Toggle between the last two windows, falling back to the last two slots.
# focus-back-and-forth exits non-zero when the previous window is gone (it
# remembers only one), which is why the fallback is chained rather than run
# alongside. Window-level matters when a slot holds two, like Slack mid-huddle.
alt-tab = 'exec-and-forget aerospace focus-back-and-forth || aerospace workspace-back-and-forth'

# Manual override: park the focused window in another slot. Routing rules above
# still apply the next time that window is created.
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-0 = 'move-node-to-workspace 0'

# Cycle windows when a slot holds more than one (accordion, so still full-screen).
alt-j = 'focus dfs-prev --boundaries workspace --boundaries-action wrap-around-the-workspace'
alt-k = 'focus dfs-next --boundaries workspace --boundaries-action wrap-around-the-workspace'

# Split the current slot side by side, and back. Affects only the slot you are
# on — everywhere else stays stacked. Useful for the occasional two-window
# comparison without turning the whole desktop into a tiling workflow.
alt-slash = 'layout tiles accordion'

# Escape hatch. Disabling stops AeroSpace intercepting keys and brings hidden
# workspaces back on screen — for screen sharing, or to hand ctrl-a / ctrl-d
# back to the terminal.
#
# One-way: while disabled the server rejects every command except
# `aerospace enable on`, and no binding fires, so this key cannot undo itself.
# Re-enable from the menu bar icon or that command. Windows do return to their
# original slots afterwards.
alt-shift-e = 'enable toggle'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
# Pop the focused window out of tiling and back, for the rare manual arrangement.
f = ['layout floating tiling', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
