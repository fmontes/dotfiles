# AeroSpace — Omarchy/Hyprland-style tiling
#
# Workspaces are generic contexts, not app slots. Nothing is assigned to a
# workspace: an app opens on whichever workspace has focus and tiles into it,
# and you arrange work by moving windows, exactly as in Omarchy.
#
# Workspaces exist only while they hold a window. There is deliberately no
# persistent-workspaces list, so Caps+5 creates workspace 5 on demand and it
# disappears when you close the last window on it — which also means the
# cycling keys visit only workspaces that actually have something in them.
#
# Routing rules exist only for windows that need behaviour they cannot get on
# their own: four utilities that should float, plus Slack and MacWhisper, whose
# windows macOS mislabels as panels. No rule moves a window to a workspace.
#
# Caps Lock is the modifier, via Raycast's Hyper Key. Option, Ctrl and Cmd are
# deliberately left alone — see the Keys section at the bottom.
#
#   Caps + arrows         focus          Caps + h j k l  move window
#   Caps + 1..9           workspace      Caps + , / .    send window to
#   Caps + tab            next workspace                 prev / next workspace
#   Caps + backtick       prev workspace Caps + b        former workspace
#   Caps + - / =          resize         Caps + o        split orientation
#   Caps + f  fullscreen  Caps + t  float toggle   Caps + /  accordion stack
#
# Everything is a held chord. There is no mode to be in or out of.

config-version = 2

start-at-login = true
auto-reload-config = true

# Land on workspace 1 after login/restart so startup is reproducible.
after-startup-command = ['workspace 1']

# ─── Tiling ──────────────────────────────────────────────────────────────────
# Every new window joins the tiling tree of the focused workspace. 'auto' picks
# the split axis from the container's aspect ratio, so a wide container splits
# side by side and a tall one stacks — the same instinct as Hyprland's dwindle.
#
# Floating is the exception, granted per app in the rules below or per window
# with alt-t. AeroSpace has no animations, so there is nothing to turn off.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Accordion is the opt-in stack mode on alt-slash, not the default. It needs
# visible padding to read as a stack rather than as a single window.
accordion-padding = 30

# flatten-containers removes a container as soon as it holds one window, so the
# tree never keeps invisible nesting from a window you closed. The opposite-
# orientation rule makes each nested split alternate axis automatically, which
# is what makes new windows land somewhere predictable without any manual
# split-direction bookkeeping.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Small and uniform: enough to see the seam between windows, not enough to
# waste screen. Same value inside and out so the grid reads as even.
gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.left = 6
gaps.outer.right = 6
gaps.outer.top = 6
gaps.outer.bottom = 6

# ─── Focus ───────────────────────────────────────────────────────────────────
# AeroSpace draws nothing around the focused window — its author left borders
# out on purpose — so the cursor is the focus indicator. It jumps to the centre
# of whatever window you focus, which also stops it being orphaned over a
# window that no longer has focus. 'lazy' means it only moves when the cursor
# is not already inside that window, so it never fights you mid-drag.
#
# focus-follows-mouse stays off: these two would form a loop, the cursor
# landing on a window and that landing re-triggering focus.
focus-follows-mouse.enabled = false
on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# ─── Window rules ────────────────────────────────────────────────────────────
# Only windows needing special behaviour appear here. Everything else gets the
# default — open on the focused workspace, join its tiling tree — which is the
# whole point of generic workspaces. There is no catch-all rule and no rule
# that moves a window to a workspace.
#
# Matched by bundle ID, first match wins (check-further-callbacks defaults to
# false).

# macOS reports a Slack huddle as a utility panel, which AeroSpace auto-floats.
# `layout tiling` hands it back to the normal tiling rules so a huddle sits
# beside the channel rather than on top of it.
#
# This deliberately does not match on the title. Slack sets the "Huddle:" title
# a moment *after* the window appears, so a `~= "^Huddle:"` pattern never
# matches at detection time — it only works when re-run later. Tiling every
# Slack window sidesteps the race: the huddle is effectively the only second
# window Slack opens, and a popped-out thread tiling too is no loss.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = ['layout tiling']

# MacWhisper gets auto-floated the same way — macOS does not report its window
# as an ordinary resizable one — but it tiles perfectly well when told to, so
# it should share a workspace rather than hover over it.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.goodsnooze.MacWhisper'
run = ['layout tiling']

# These two float on whatever workspace is in front instead of splitting it.
# They are things you glance at, not windows you work in.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.1password.1password'
run = ['layout floating']

# Cap's recording overlay and krisp's mic widget are transient controls, not
# windows worth tiling. Without these they would split whatever workspace is
# focused, mid-recording.
[[on-window-detected]]
if = 'test %{app-bundle-id} = so.cap.desktop'
run = ['layout floating']

[[on-window-detected]]
if = 'test %{app-bundle-id} = ai.krisp.krispMac'
run = ['layout floating']

# ─── Monitors ────────────────────────────────────────────────────────────────
# Every workspace is pinned to the main display, so behaviour is identical on
# the MacBook screen alone and with an external monitor attached: everything
# follows whichever display macOS calls main (System Settings → Displays).
#
# This is carried over deliberately rather than reconsidered — it is what stops
# a workspace turning up on a monitor you did not expect. The cost is that the
# non-main display holds nothing, so alt+arrows has no second monitor to cross
# into. Delete this whole block to let AeroSpace spread workspaces across both.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'

# ─── Exec environment ────────────────────────────────────────────────────────
# AeroSpace launches from macOS login with a bare environment, so spell out
# where the aerospace binary and restore-layout live.
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '${HOME}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# ─── Keys ────────────────────────────────────────────────────────────────────
# Caps Lock is the window-manager modifier. Raycast's Hyper Key makes Caps Lock
# emit ctrl+alt+shift+cmd — verified on this machine by polling
# CGEventSource.flagsState while it was held, not assumed — so every binding
# below is written against that literal four-modifier sequence. Read
# `ctrl-alt-shift-cmd-` as "Caps".
#
# The point of routing everything through Caps is that the individual modifiers
# stay free for what they are for:
#
#   Caps    window management
#   Option  text navigation — Option+arrow word jump is untouched
#   Ctrl    terminal — ctrl-a and ctrl-d are untouched
#   Cmd     macOS and app shortcuts
#
# ── Why move is hjkl and not Caps+Shift+arrows ───────────────────────────────
# Raycast's Hyper includes Shift, so holding Shift alongside Caps sets a bit
# that is already set: Caps+Shift+Left is byte-identical to Caps+Left, and
# AeroSpace cannot tell them apart. The same applies to Ctrl and Cmd — Hyper
# consumes all four modifiers AeroSpace supports, and `fn` is not one it
# accepts. There is no second chord level at all.
#
# So the second level becomes a different key rather than a different modifier:
# arrows focus, hjkl moves. Everything stays a held chord, which is the point —
# AeroSpace cannot do hold-to-activate modes, and a toggled mode is worse than
# a chord for something you do this often.
#
# Raycast's Hyper modifier set is fixed at ctrl+alt+shift+cmd and cannot be
# narrowed, so Caps+Shift is not recoverable without a different remapper.
[mode.main.binding]

# ── Focus ────────────────────────────────────────────────────────────────────
# all-monitors-outer-frame lets focus cross onto a second display instead of
# stopping at the workspace edge; 'stop' at the outer frame means the far edge
# is a dead end rather than wrapping you to the opposite side of the screen,
# which is what Hyprland's movefocus does.
ctrl-alt-shift-cmd-left = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
ctrl-alt-shift-cmd-down = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
ctrl-alt-shift-cmd-up = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
ctrl-alt-shift-cmd-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'

# ── Resize ───────────────────────────────────────────────────────────────────
# 'smart' resizes along whichever axis the focused window's container runs, so
# one pair of keys covers both directions. Needs at least two tiled windows in
# the workspace — there is nothing to resize against otherwise.
ctrl-alt-shift-cmd-minus = 'resize smart -50'
ctrl-alt-shift-cmd-equal = 'resize smart +50'

# ── Workspaces ───────────────────────────────────────────────────────────────
# Generic contexts, created on demand. --auto-back-and-forth makes each key a
# toggle: pressing the key for the workspace you are already on returns you to
# the previous one.
#
# 1-9 rather than 1-4: the workspace model is unchanged by this migration, and
# shrinking it would have been a change of its own.
ctrl-alt-shift-cmd-1 = 'workspace --auto-back-and-forth 1'
ctrl-alt-shift-cmd-2 = 'workspace --auto-back-and-forth 2'
ctrl-alt-shift-cmd-3 = 'workspace --auto-back-and-forth 3'
ctrl-alt-shift-cmd-4 = 'workspace --auto-back-and-forth 4'
ctrl-alt-shift-cmd-5 = 'workspace --auto-back-and-forth 5'
ctrl-alt-shift-cmd-6 = 'workspace --auto-back-and-forth 6'
ctrl-alt-shift-cmd-7 = 'workspace --auto-back-and-forth 7'
ctrl-alt-shift-cmd-8 = 'workspace --auto-back-and-forth 8'
ctrl-alt-shift-cmd-9 = 'workspace --auto-back-and-forth 9'

# Cycling. Caps+Shift+Tab is unavailable — Hyper already contains Shift — so
# prev lives on backtick, which sits directly above Tab and reads as its
# reverse. Both visit only workspaces that hold a window, because no workspace
# is persistent.
ctrl-alt-shift-cmd-tab = 'workspace --wrap-around next'
ctrl-alt-shift-cmd-backtick = 'workspace --wrap-around prev'

# Former workspace. Caps+Ctrl+Tab was the requested spelling but Ctrl is inside
# Hyper too, so this is on B for "back".
ctrl-alt-shift-cmd-b = 'workspace-back-and-forth'

# ── Move ─────────────────────────────────────────────────────────────────────
# Held, not modal. AeroSpace fires hotkeys on key *down* only — its config has
# no key-up option and its binary has no hotkey-release event — so a
# hold-to-activate mode is not something it can express. The only thing that
# behaves like "hold" is a modifier chord, which is what this is: keep Caps
# down, tap a direction.
#
# hjkl rather than the arrows because the arrows are focus, and Caps+Shift is
# unavailable to separate them — Raycast's Hyper already contains Shift. Same
# direction set as Hyprland and vim.
ctrl-alt-shift-cmd-h = 'move left'
ctrl-alt-shift-cmd-j = 'move down'
ctrl-alt-shift-cmd-k = 'move up'
ctrl-alt-shift-cmd-l = 'move right'

# Send the window to the next or previous workspace, wrapping. Relative rather
# than direct: addressing a workspace by number would need Caps+Shift+N, which
# does not exist, and no other single key set maps cleanly to 1-9.
ctrl-alt-shift-cmd-comma = 'move-node-to-workspace --wrap-around prev'
ctrl-alt-shift-cmd-period = 'move-node-to-workspace --wrap-around next'

# ── Layout ───────────────────────────────────────────────────────────────────
# Flip the focused window's container between side-by-side and stacked — the
# equivalent of Hyprland's togglesplit. On O because J is a direction now.
ctrl-alt-shift-cmd-o = 'layout horizontal vertical'

# Collapse the workspace into an accordion stack and back, for when three
# windows tiled is two too many.
ctrl-alt-shift-cmd-slash = 'layout tiles accordion'

# Fullscreen the focused window, and back. Gaps stay, so it still reads as a
# managed window rather than a macOS native fullscreen space.
ctrl-alt-shift-cmd-f = 'fullscreen'

# Pop the focused window out of the tiling tree and back.
ctrl-alt-shift-cmd-t = 'layout floating tiling'

# Rebuild the current workspace's tree as one flat row. The escape hatch when a
# sequence of moves has produced nesting you no longer want to reason about.
ctrl-alt-shift-cmd-backslash = 'flatten-workspace-tree'

# ── Maintenance ──────────────────────────────────────────────────────────────
# Re-apply the window rules to every open window. Rules normally run only when
# a window is first detected, so this is what picks up an app that was already
# running before its float rule existed.
ctrl-alt-shift-cmd-r = 'exec-and-forget aerospace run-callback --for-every-window on-window-detected'

# Escape hatch. Disabling stops AeroSpace intercepting keys and brings hidden
# workspaces back on screen — for screen sharing, or for an app that fights the
# window manager.
#
# One-way: while disabled the server rejects every command except
# `aerospace enable on`, and no binding fires, so this key cannot undo itself.
# Re-enable from the menu bar icon or that command.
ctrl-alt-shift-cmd-e = 'enable toggle'

ctrl-alt-shift-cmd-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
